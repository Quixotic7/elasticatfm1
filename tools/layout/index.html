<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elasticat Layout</title>
<link rel="stylesheet" href="designer.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="dot"></span>ELASTICAT <b>LAYOUT</b></div>
  <label class="name">DESIGN <input id="dname" spellcheck="false" maxlength="40"></label>
  <div class="tools">
    <button id="undo" title="Undo (Ctrl+Z)">UNDO</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">REDO</button>
    <button id="import" title="Open a design file">IMPORT</button>
    <button id="export" class="acc" title="Download elasticat.json">EXPORT</button>
    <select id="open" title="Start from the shipped layout or a saved design"></select>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
  <div id="status"></div>
</header>
<main>
  <section id="tree" aria-label="Categories, pages, lanes"></section>
  <div class="split" id="split0" role="separator" aria-orientation="vertical" title="drag to resize · double-click: back to the default"></div>
  <section id="side">
    <div id="inspector"></div>
    <div id="tray"><div class="h">UNPLACED <input id="search" placeholder="search names and descriptions" spellcheck="false"></div><div id="traylist"></div></div>
    <div id="diff"><div class="h">CHANGES FROM THE SHIPPED LAYOUT</div><div id="difflist"></div></div>
    <div id="lint"></div>
  </section>
  <div class="split" id="split1" role="separator" aria-orientation="vertical" title="drag to resize · double-click: back to the default"></div>
  <section id="centre">
    <div id="ctxbar"></div>
    <div id="unit">
      <div id="screenwrap"><canvas id="screen" width="240" height="240"></canvas></div>
    </div>
    <div id="buttons"></div>
    <div id="panelwrap" title=""><canvas id="panel" aria-label="The FM-1: click and hold buttons and keys, Shift-click to latch one, drag or wheel the knobs"></canvas>
      <div class="panelhint">hold: press and hold · latch: Shift-click (click again to let go; Esc: all) · knobs: drag or wheel · keys: struck lower = louder · keyboard after a click on the panel</div></div>
  </section>
</main>
<div id="tip" hidden></div>
<script src="ec_layout.js"></script>
<script type="module" src="designer.js"></script>
</body>
</html>
