<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elasticat sampling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 14px 22px; background: #121210; color: #F6F3E8; font-family: 'VT323', monospace; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

<div style="height: 40px; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back to perform" style="height: 40px; display: flex; align-items: center; gap: 8px; color: #CFCBBE; text-decoration: none; font: 400 22px/1 'VT323', monospace">
<svg aria-hidden="true" width="10" height="16" viewBox="0 0 5 8" shape-rendering="crispEdges"><path d="M3 0h2v2h-2zM1 2h2v2h-2zM1 4h2v2h-2zM3 6h2v2h-2z" fill="#CFCBBE"></path></svg>PERFORM</a>
<span style="font: 700 16px/1 'Silkscreen', monospace; letter-spacing: 1px">T3 · SAMPLE</span>
<span style="width: 92px; text-align: right; font: 400 20px/1 'VT323', monospace; color: #9A978B">LOOP</span>
</div>

<div role="tablist" aria-label="Sample views" style="height: 36px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid #2E2D29; background: #0B0B0A">
<a href="Sample.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; color: #9A978B; text-decoration: none; font: 400 8px/1 'Silkscreen', monospace">POOL</a>
<a href="Sample.dc.html" role="tab" aria-selected="true" style="display: flex; align-items: center; justify-content: center; background: #F6F3E8; color: #0B0B0A; text-decoration: none; font: 400 8px/1 'Silkscreen', monospace">REC</a>
<a href="Razor.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; color: #9A978B; text-decoration: none; font: 400 8px/1 'Silkscreen', monospace">RAZOR</a>
</div>

<dc-import name="Display" mode="rec" cols="{{176}}" rows="{{110}}" scale="{{2}}" pad="{{3}}" hint-size="362px,230px"></dc-import>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font: 400 8px/1 'Silkscreen', monospace; color: #9A978B">SOURCE</span>
<div role="radiogroup" aria-label="Record source" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="height: 44px; border: 2px solid {{s.line}}; background: {{s.bg}}; color: {{s.fg}}; font: 400 20px/1 'VT323', monospace; display: flex; align-items: center; gap: 8px; padding: 0 10px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35); cursor: pointer">
<span style="width: 10px; height: 10px; box-sizing: border-box; border: 2px solid {{s.fg}}; background: {{s.dot}}"></span>{{s.n}}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button type="button" aria-label="{{o.k}} {{o.v}}" style="height: 52px; box-sizing: border-box; padding: 6px 9px; border: 2px solid #2E2D29; background: #1A1917; color: #F6F3E8; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer">
<span style="font: 400 8px/1 'Silkscreen', monospace; color: #9A978B">{{o.k}}</span>
<span style="font: 400 24px/0.8 'VT323', monospace">{{o.v}}</span>
</button>
</sc-for>
</div>

<div style="height: 60px; display: grid; grid-template-columns: 1fr 2fr; gap: 6px">
<button type="button" aria-pressed="true" style="border: 2px solid #FF6A1F; background: #1E1D1A; color: #FF6A1F; font: 400 24px/1 'VT323', monospace; cursor: pointer">ARMED</button>
<button type="button" aria-label="Stop recording" style="border: 0; background: #FF6A1F; color: #0B0B0A; font: 700 16px/1 'Silkscreen', monospace; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer"><span style="width: 14px; height: 14px; background: #0B0B0A"></span>STOP REC</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font: 400 8px/1 'Silkscreen', monospace; color: #9A978B"><span>POOL</span><span>7 / 64 · 38 MB</span></div>
<sc-for list="{{pool}}" as="p" hint-placeholder-count="2">
<button type="button" style="height: 36px; border: 2px solid {{p.line}}; background: #1A1917; color: #F6F3E8; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 0 10px; text-align: left; font: 400 20px/1 'VT323', monospace; cursor: pointer">
<span style="color: {{p.nc}}">{{p.slot}}</span><span style="white-space: nowrap; overflow: hidden">{{p.name}}</span><span style="color: #9A978B">{{p.meta}}</span>
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { src: 0 }; }
  renderVals() {
    const sources = ['IN L+R','FM-1 USB IN','RESAMPLE MST','RESAMPLE T2'].map((n, i) => {
      const on = i === this.state.src;
      return { n, on: on ? 'true' : 'false', bg: on ? '#F6F3E8' : '#1E1D1A', fg: on ? '#0B0B0A' : '#CFCBBE', line: on ? '#F6F3E8' : '#2E2D29', dot: on ? '#0B0B0A' : 'transparent', pick: () => this.setState({ src: i }) };
    });
    const opts = [['THRESHOLD','-24 DB'],['LENGTH','4 BAR'],['START','ON PLAY'],['AFTER','SLICE x16']].map(o => ({ k: o[0], v: o[1] }));
    const pool = [
      { slot: '07', name: 'REC 261029-2041', meta: 'REC…', nc: '#FF6A1F', line: '#FF6A1F' },
      { slot: '06', name: 'BREAK_136.WAV', meta: '136 · 4B', nc: '#9A978B', line: '#2E2D29' }
    ];
    return { sources, opts, pool };
  }
}
</script>
</body>
</html>
