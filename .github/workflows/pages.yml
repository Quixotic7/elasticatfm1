name: Publish the site (landing page + user guide)

on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/guide/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the landing page at the root, the guide under /guide/ (the landing page forwards old /#anchor links there)
      - name: Assemble the site
        run: |
          mkdir -p _site/guide
          cp -R docs/site/. _site/
          cp -R docs/guide/. _site/guide/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
