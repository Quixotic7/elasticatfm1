<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elasticat razor slice editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 14px 22px; background: #121210; color: #F6F3E8; font-family: 'VT323', monospace; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

<div style="height: 40px; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back to perform" style="height: 40px; display: flex; align-items: center; gap: 8px; color: #CFCBBE; text-decoration: none; font: 400 22px/1 'VT323', monospace">
<svg aria-hidden="true" width="10" height="16" viewBox="0 0 5 8" shape-rendering="crispEdges"><path d="M3 0h2v2h-2zM1 2h2v2h-2zM0 4h2v0h0zM1 4h2v2h-2zM3 6h2v2h-2z" fill="#CFCBBE"></path></svg>PERFORM</a>
<span style="font: 700 16px/1 'Silkscreen', monospace; letter-spacing: 1px">T2 · SLICE</span>
<span style="width: 92px; text-align: right; font: 400 20px/1 'VT323', monospace; color: #9A978B">RAZOR_POLY</span>
</div>

<div role="tablist" aria-label="Sample views" style="height: 36px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid #2E2D29; background: #0B0B0A">
<a href="Sample.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; color: #9A978B; text-decoration: none; font: 400 8px/1 'Silkscreen', monospace">POOL</a>
<a href="Sample.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; color: #9A978B; text-decoration: none; font: 400 8px/1 'Silkscreen', monospace">REC</a>
<a href="Razor.dc.html" role="tab" aria-selected="true" style="display: flex; align-items: center; justify-content: center; background: #F6F3E8; color: #0B0B0A; text-decoration: none; font: 400 8px/1 'Silkscreen', monospace">RAZOR</a>
</div>

<dc-import name="Display" mode="razor" cols="{{176}}" rows="{{110}}" scale="{{2}}" pad="{{3}}" hint-size="362px,230px"></dc-import>

<div aria-label="Zoom overview: whole file, window shows 100 percent" role="img" style="height: 24px; box-sizing: border-box; border: 2px solid #2E2D29; background: #0B0B0A; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; padding: 4px">
<sc-for list="{{over}}" as="o" hint-placeholder-count="12"><span style="background: {{o}}"></span></sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{params}}" as="p" hint-placeholder-count="4">
<button type="button" aria-label="{{p.k}} {{p.v}}" style="height: 56px; box-sizing: border-box; padding: 6px 7px; border: 2px solid {{p.line}}; background: #1A1917; color: #F6F3E8; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer">
<span style="font: 400 8px/1 'Silkscreen', monospace; color: #9A978B">{{p.k}}</span>
<span style="font: 400 22px/0.8 'VT323', monospace; white-space: nowrap">{{p.v}}</span>
</button>
</sc-for>
</div>

<div role="group" aria-label="Slice pads 1 to 16" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{pads}}" as="p" hint-placeholder-count="16">
<button type="button" aria-label="{{p.aria}}" style="height: 58px; border: 0; padding: 7px; box-sizing: border-box; background: {{p.bg}}; color: {{p.fg}}; box-shadow: {{p.sh}}; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; cursor: pointer">
<span style="font: 400 22px/0.8 'VT323', monospace">{{p.n}}</span>
<span style="font: 400 8px/1 'Silkscreen', monospace; color: {{p.sub}}">{{p.len}}</span>
</button>
</sc-for>
</div>

<div style="height: 44px; display: grid; grid-template-columns: 1.4fr 1.2fr 1fr 0.7fr 0.7fr; gap: 4px">
<button type="button" style="border: 2px solid #FF6A1F; background: #1E1D1A; color: #FF6A1F; font: 400 20px/1 'VT323', monospace; cursor: pointer">AUTO-CHOP</button>
<button type="button" style="border: 2px solid #2E2D29; background: #1E1D1A; color: #CFCBBE; font: 400 20px/1 'VT323', monospace; cursor: pointer">REDIST</button>
<button type="button" style="border: 2px solid #2E2D29; background: #1E1D1A; color: #CFCBBE; font: 400 20px/1 'VT323', monospace; cursor: pointer">SNAP ZC</button>
<button type="button" aria-label="Zoom out" style="border: 2px solid #2E2D29; background: #1E1D1A; color: #CFCBBE; font: 400 24px/1 'VT323', monospace; cursor: pointer">−</button>
<button type="button" aria-label="Zoom in" style="border: 2px solid #2E2D29; background: #1E1D1A; color: #CFCBBE; font: 400 24px/1 'VT323', monospace; cursor: pointer">+</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const over = []; for (let i = 0; i < 12; i++) over.push(i === 4 ? '#F6F3E8' : '#55524A');
    const params = [['STRT','0.375'],['END','0.500'],['PLAY','1SHOT'],['CHOKE','A']].map((p, i) => ({ k: p[0], v: p[1], line: i < 2 ? '#F6F3E8' : '#2E2D29' }));
    const lens = ['1/8','1/16','1/16','1/8','1/8','1/16','1/16','1/8','1/16','1/16','1/16','1/16'];
    const pads = []; for (let i = 0; i < 16; i++) {
      const has = i < 12, sel = i === 4, hot = i === 8;
      pads.push({ n: String(i + 1).padStart(2, '0'), len: has ? lens[i] : 'EMPTY',
        bg: sel ? '#F6F3E8' : hot ? '#FF6A1F' : has ? '#2C2B27' : '#161614',
        fg: sel || hot ? '#0B0B0A' : has ? '#F6F3E8' : '#5E5C54', sub: sel || hot ? '#0B0B0A' : '#9A978B',
        sh: has ? 'inset 0 -4px 0 rgba(0,0,0,0.35)' : 'inset 0 0 0 2px #24231F',
        aria: 'Pad ' + (i + 1) + (has ? ', slice ' + lens[i] : ', empty') + (sel ? ', selected' : '') + (hot ? ', playing' : '') });
    }
    return { over, params, pads };
  }
}
</script>
</body>
</html>
