<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elasticat AUv3 compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1024px; height: 460px; box-sizing: border-box; padding: 20px; background: #121210; color: #F6F3E8; font-family: 'VT323', monospace; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<div style="height: 36px; display: flex; align-items: stretch; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; padding-right: 8px">
<svg aria-hidden="true" width="22" height="18" viewBox="0 0 11 9" shape-rendering="crispEdges"><path d="M0 0h1v1h-1zM10 0h1v1h-1zM0 1h2v1h-2zM9 1h2v1h-2zM0 2h3v1h-3zM8 2h3v1h-3zM0 3h11v1h-11zM0 4h2v1h-2zM3 4h5v1h-5zM9 4h2v1h-2zM0 5h11v1h-11zM0 6h6v1h-6zM7 6h4v1h-4zM1 7h9v1h-9zM2 8h7v1h-7z" fill="#F6F3E8"></path></svg>
<span style="font: 700 8px/1 'Silkscreen', monospace; letter-spacing: 1px">ELASTICAT · AUV3</span>
</div>
<div role="tablist" aria-label="Tracks and buses" style="flex: 1; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="9">
<button type="button" role="tab" aria-selected="{{t.sel}}" style="border: 0; padding: 0; background: {{t.bg}}; color: {{t.fg}}; font: 400 20px/1 'VT323', monospace; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35); cursor: pointer">{{t.name}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 2px solid #2E2D29; background: #0B0B0A">
<span style="font: 400 8px/1 'Silkscreen', monospace; color: #9A978B">HOST</span><span style="font: 400 24px/1 'VT323', monospace">120.0</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 2px dashed #5E5C54; color: #9A978B; font: 400 20px/1 'VT323', monospace">FM-1 · IN APP</div>
</div>

<div style="display: flex; gap: 16px">
<dc-import name="Display" mode="warp" cols="{{176}}" rows="{{110}}" scale="{{2}}" pad="{{6}}" hint-size="368px,236px"></dc-import>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<div role="tablist" aria-label="Parameter categories" style="height: 36px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button type="button" role="tab" aria-selected="{{c.sel}}" style="border: 2px solid {{c.line}}; background: {{c.bg}}; color: {{c.fg}}; font: 400 20px/1 'VT323', monospace; padding: 0; cursor: pointer">{{c.n}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{params}}" as="p" hint-placeholder-count="8">
<button type="button" aria-label="{{p.k}} {{p.v}}" style="height: 68px; box-sizing: border-box; padding: 8px 9px; border: 2px solid {{p.line}}; background: #1A1917; color: #F6F3E8; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer">
<span style="font: 400 8px/1 'Silkscreen', monospace; color: #9A978B">{{p.k}}</span>
<span style="font: 400 28px/0.8 'VT323', monospace; color: {{p.vc}}">{{p.v}}</span>
<span style="display: flex; gap: 2px; height: 4px"><sc-for list="{{p.segs}}" as="g" hint-placeholder-count="12"><span style="flex: 1; background: {{g}}"></span></sc-for></span>
</button>
</sc-for>
</div>
<button type="button" aria-label="Loop scrub strip, key 7 held" style="height: 40px; padding: 4px; border: 2px solid #2E2D29; background: #0B0B0A; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; cursor: pointer">
<sc-for list="{{loopKeys}}" as="l" hint-placeholder-count="16"><span style="background: {{l}}"></span></sc-for>
</button>
</div>
</div>

<div role="group" aria-label="Steps 1 to 16" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="16">
<button type="button" aria-label="Step {{s.n}}" aria-pressed="{{s.on}}" style="height: 64px; border: 0; padding: 0; position: relative; background: {{s.bg}}; box-shadow: {{s.sh}}; cursor: pointer">
<span style="position: absolute; left: 6px; bottom: 7px; font: 400 8px/1 'Silkscreen', monospace; color: {{s.fg}}">{{s.n}}</span>
<sc-if value="{{s.lock}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; top: 6px; width: 6px; height: 6px; background: #0B0B0A"></span></sc-if>
</button>
</sc-for>
</div>

<div style="height: 40px; display: flex; gap: 6px">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="4">
<button type="button" aria-label="Step page {{p.n}}" style="width: 56px; border: 2px solid {{p.line}}; background: {{p.bg}}; color: {{p.fg}}; font: 400 20px/1 'VT323', monospace; cursor: pointer">{{p.n}}</button>
</sc-for>
<span style="flex: 1"></span>
<button type="button" style="width: 80px; border: 2px solid #2E2D29; background: #1E1D1A; color: #CFCBBE; font: 400 20px/1 'VT323', monospace; cursor: pointer">FILL</button>
<button type="button" style="width: 80px; border: 2px solid #2E2D29; background: #1E1D1A; color: #CFCBBE; font: 400 20px/1 'VT323', monospace; cursor: pointer">UNDO</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const tracks = ['T1','T2','T3','T4','T5','T6','S1','S2','M'].map((n, i) => ({ name: n, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#F6F3E8' : '#1E1D1A', fg: i === 0 ? '#0B0B0A' : '#CFCBBE' }));
    const cats = ['FN','TRIG','SRC','FILT','AMP','FX','MOD'].map((n, i) => ({ n, sel: i === 2 ? 'true' : 'false', bg: i === 2 ? '#F6F3E8' : '#1E1D1A', fg: i === 2 ? '#0B0B0A' : (i === 0 ? '#FF6A1F' : '#CFCBBE'), line: i === 2 ? '#F6F3E8' : '#2E2D29' }));
    const P = [['GSIZ','120MS',0.45],['GDEN','18',0.3],['GJIT','35%',0.35],['OWIN','64',0.5],['OWAN','22',0.17],['CHOP','8',0.25],['LOOP','FWD',0],['RATE','1/1',0.6]];
    const params = P.map((p, i) => { const n = Math.round(p[2] * 12), lock = i === 2; const segs = []; for (let j = 0; j < 12; j++) segs.push(j < n ? (lock ? '#FF6A1F' : '#CFCBBE') : '#34332E'); return { k: p[0], v: p[1], vc: lock ? '#FF6A1F' : '#F6F3E8', line: i < 2 ? '#F6F3E8' : '#2E2D29', segs }; });
    const loopKeys = []; for (let i = 0; i < 16; i++) loopKeys.push(i === 6 ? '#F6F3E8' : (i >= 4 && i < 10 ? '#55524A' : '#1E1D1A'));
    const trigs = [1, 5, 7, 9, 11, 13, 15], locked = [5, 11], play = 6;
    const steps = []; for (let i = 0; i < 16; i++) { const n = i + 1, on = trigs.includes(n); steps.push({ n: String(n), on: on ? 'true' : 'false', lock: on && locked.includes(n), bg: on ? '#FF6A1F' : (i % 4 === 0 ? '#24231F' : '#1E1D1A'), fg: on ? '#0B0B0A' : '#9A978B', sh: i === play ? 'inset 0 0 0 3px #F6F3E8' : 'inset 0 -3px 0 rgba(0,0,0,0.35)' }); }
    const pages = ['1','2','3','4'].map((n, i) => ({ n, bg: i === 0 ? '#F6F3E8' : '#1E1D1A', fg: i === 0 ? '#0B0B0A' : '#9A978B', line: i === 0 ? '#F6F3E8' : '#2E2D29' }));
    return { tracks, cats, params, loopKeys, steps, pages };
  }
}
</script>
</body>
</html>
